<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>
    <div class="header-center">
      <div id="greeting" class="greeting"></div>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="icon-btn" title="Toggle Light/Dark Mode">🌙</button>
      <button id="name-btn" class="icon-btn" title="Set your name">✏️</button>
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card timer-card" aria-label="Focus Timer">
      <h2 class="card-title">🎯 Focus Timer</h2>

      <div class="timer-display" id="timer-display">25:00</div>

      <div class="timer-duration">
        <label for="pomodoro-minutes">Session length (min):</label>
        <input type="number" id="pomodoro-minutes" min="1" max="120" value="25" />
        <button id="apply-duration" class="btn btn-sm">Apply</button>
      </div>

      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">▶ Start</button>
        <button id="timer-stop"  class="btn btn-secondary">⏸ Stop</button>
        <button id="timer-reset" class="btn btn-secondary">↺ Reset</button>
      </div>

      <p id="timer-status" class="timer-status">Ready to focus!</p>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card todo-card" aria-label="To-Do List">
      <h2 class="card-title">📝 To-Do List</h2>

      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a new task…" maxlength="120" />
        <button id="todo-add" class="btn btn-primary">Add</button>
      </div>

      <div class="todo-toolbar">
        <span class="task-count" id="task-count">0 tasks</span>
        <div class="sort-controls">
          <label for="sort-select">Sort:</label>
          <select id="sort-select">
            <option value="default">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done-last">Done last</option>
            <option value="done-first">Done first</option>
          </select>
        </div>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <div class="todo-footer">
        <button id="clear-done" class="btn btn-danger-ghost btn-sm">🗑 Clear completed</button>
      </div>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card links-card" aria-label="Quick Links">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="link-input-group">
        <input type="text" id="link-name" placeholder="Label (e.g. YouTube)" maxlength="30" />
        <input type="url"  id="link-url"  placeholder="https://…" />
        <button id="link-add" class="btn btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
    </section>

  </main>

  <!-- ===== NAME MODAL ===== -->
  <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h3 id="modal-title">What's your name?</h3>
      <input type="text" id="name-input" placeholder="Enter your name…" maxlength="40" />
      <div class="modal-actions">
        <button id="name-save" class="btn btn-primary">Save</button>
        <button id="name-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
